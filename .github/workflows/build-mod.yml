name: Build mod from ZIP
on:
  push:
    paths:
      - "input/*.zip"
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Extract the zip
        run: |
          ZIP=$(ls input/*.zip | sort | tail -n 1)
          echo "Using $ZIP"
          mkdir -p work
          unzip -q "$ZIP" -d work
      - name: Build
        run: |
          GRADLEW=$(find work -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then echo "No gradlew found in the zip"; exit 1; fi
          PROJ=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          cd "$PROJ"
          ./gradlew build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/jars"
          find build/libs -name "*.jar" ! -name "*-sources.jar" ! -name "*-dev.jar" ! -name "*-javadoc.jar" -exec cp {} "$GITHUB_WORKSPACE/jars/" \;
      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: jars/*.jar
